backend:
  name: git-gateway
  branch: netlify-decap

# Local testing (see README): running `npx decap-server` alongside the dev
# server lets you use the CMS without Netlify Identity being set up yet.
# Comment the two lines below back out before deploying for real.
# local_backend: true

media_folder: "src/assets/images"
public_folder: "/assets/images"

site_url: https://astounding-baklava-758d25.netlify.app
display_url: https://astounding-baklava-758d25.netlify.app

collections:
  - name: "site"
    label: "Site Settings"
    files:
      - file: "src/_data/site.json"
        label: "Contact Info & Business Details"
        name: "site"
        fields:
          - { label: "Business Name", name: "businessName", widget: "string" }
          - { label: "Therapist Name", name: "therapistName", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone (display, e.g. (615) 549-8145)", name: "phone", widget: "string" }
          - { label: "Phone (for links, e.g. +16155498145)", name: "phoneTel", widget: "string" }

  - name: "home"
    label: "Home Page"
    files:
      - file: "src/_data/pages/home.json"
        label: "Home Page Content"
        name: "home"
        fields:
          - { label: "Eyebrow (small text above headline)", name: "eyebrow", widget: "string" }
          - { label: "Headline — part before emphasis", name: "heroTitlePre", widget: "string" }
          - { label: "Headline — emphasized word", name: "heroTitleEmphasis", widget: "string" }
          - { label: "Headline — part after emphasis", name: "heroTitlePost", widget: "string" }
          - { label: "Subheadline", name: "heroSub", widget: "text" }
          - { label: "Hero Photo", name: "heroImage", widget: "image" }
          - { label: "Pull Quote", name: "introQuote", widget: "text" }
          - { label: "Pull Quote Photo", name: "introImage", widget: "image" }
          - { label: "Break Section Quote", name: "breakQuote", widget: "string" }
          - { label: "Break Section Photo", name: "breakImage", widget: "image" }
          - { label: "Teaser Section Heading", name: "teaserHeading", widget: "string" }
          - label: "Teaser Cards"
            name: "teasers"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Link Text", name: "linkText", widget: "string" }
              - { label: "Link URL", name: "url", widget: "string" }
              - { label: "Photo", name: "image", widget: "image" }
          - { label: "Notebook Quote Photo", name: "notebookImage", widget: "image" }
          - { label: "Closing CTA Heading", name: "ctaHeading", widget: "string" }
          - { label: "Closing CTA Text", name: "ctaText", widget: "text" }

  - name: "about"
    label: "About Page"
    files:
      - file: "src/_data/pages/about.json"
        label: "About Page Content"
        name: "about"
        fields:
          - { label: "Page Heading", name: "heading", widget: "string" }
          - { label: "Main Photo", name: "photoMain", widget: "image" }
          - { label: "Small Accent Photo", name: "photoAccent", widget: "image" }
          - label: "Bio Paragraphs"
            name: "bioParagraphs"
            widget: "list"
            field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - { label: "Faith Callout Heading", name: "faithHeading", widget: "string" }
          - { label: "Faith Callout Text", name: "faithText", widget: "text" }
          - { label: "Closing CTA Heading", name: "ctaHeading", widget: "string" }
          - { label: "Closing CTA Text", name: "ctaText", widget: "text" }
          - { label: "Closing CTA Button Text", name: "ctaButtonText", widget: "string" }
          - { label: "Closing CTA Link", name: "ctaUrl", widget: "string" }

  - name: "approach"
    label: "My Approach Page"
    files:
      - file: "src/_data/pages/approach.json"
        label: "Approach Page Content"
        name: "approach"
        fields:
          - { label: "Page Heading", name: "heading", widget: "string" }
          - { label: "Intro Text", name: "intro", widget: "text" }
          - label: "Approach Cards"
            name: "cards"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Photo", name: "image", widget: "image" }
          - { label: "Modalities Section Label", name: "modalitiesHeading", widget: "string" }
          - { label: "Modalities Intro (optional)", name: "modalitiesIntro", widget: "text", required: false }
          - label: "Modalities"
            name: "modalities"
            widget: "list"
            required: false
            hint: "Add one entry per modality — e.g. EMDR, Gottman Method, CBT."
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - { label: "Life Transitions Heading", name: "transitionsHeading", widget: "string" }
          - { label: "Life Transitions Text", name: "transitionsText", widget: "text" }
          - { label: "Life Transitions Photo", name: "transitionsImage", widget: "image" }
          - { label: "Closing CTA Heading", name: "ctaHeading", widget: "string" }
          - { label: "Closing CTA Text", name: "ctaText", widget: "text" }
          - { label: "Closing CTA Button Text", name: "ctaButtonText", widget: "string" }
          - { label: "Closing CTA Link", name: "ctaUrl", widget: "string" }

  - name: "services"
    label: "Services Page"
    files:
      - file: "src/_data/pages/services.json"
        label: "Services Page Content"
        name: "services"
        fields:
          - { label: "Page Heading", name: "heading", widget: "string" }
          - { label: "Intro Text", name: "intro", widget: "text" }
          - label: "Service Cards"
            name: "cards"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Photo", name: "image", widget: "image" }
              - label: "Extra Small Photos (optional)"
                name: "extraImages"
                widget: "list"
                required: false
                field: { label: "Photo", name: "image", widget: "image" }
          - { label: "Faith Banner Heading", name: "faithHeading", widget: "string" }
          - { label: "Faith Banner Text", name: "faithText", widget: "text" }
          - { label: "Faith Banner Background Photo", name: "faithImage", widget: "image" }
          - { label: "Closing CTA Heading", name: "ctaHeading", widget: "string" }
          - { label: "Closing CTA Text", name: "ctaText", widget: "text" }
          - { label: "Closing CTA Button Text", name: "ctaButtonText", widget: "string" }
          - { label: "Closing CTA Link", name: "ctaUrl", widget: "string" }

  - name: "contact"
    label: "Contact Page"
    files:
      - file: "src/_data/pages/contact.json"
        label: "Contact Page Content"
        name: "contact"
        fields:
          - { label: "Page Heading", name: "heading", widget: "string" }
          - { label: "Intro Text (includes response-time note)", name: "intro", widget: "text" }
          - { label: "Session Format", name: "sessionFormat", widget: "string" }
          - { label: "Rate", name: "rate", widget: "string" }
          - { label: "Rate Note", name: "rateNote", widget: "string" }
          - { label: "Getting Started Heading", name: "stepsHeading", widget: "string" }
          - { label: "Getting Started Photo", name: "stepsImage", widget: "image" }
          - label: "Steps"
            name: "steps"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "Contact Page Photo", name: "headshot", widget: "image" }
          - { label: "Crisis / Emergency Note", name: "crisisNote", widget: "text" }
